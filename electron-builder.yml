appId: app.ahral.desktop
productName: Ahral
copyright: Copyright © 2026 Paul Kenneth Ilan
directories:
  output: dist
  buildResources: build

# Only ship the compiled app. Source, tests, samples and local data stay out of the installer;
# electron-builder adds the production dependencies (pdfjs-dist, compromise, word-list).
files:
  - out/**/*
  - package.json
  # PDF.js's optional canvas library draws pages as images. Ahral only reads text, so
  # its 37 MB native binary is left out (npm run test:packaged checks the app still works).
  - "!node_modules/@napi-rs/**"
  # Ahral loads only PDF.js's legacy (Node-compatible) build; the browser builds and viewer stay out.
  - "!node_modules/pdfjs-dist/{build,web,image_decoders,types}/**"
  - "!node_modules/pdfjs-dist/legacy/{web,image_decoders}/**"
  - "!**/*.map"

win:
  target:
    - target: nsis
      arch: x64
  icon: build/icon.png

nsis:
  # Installs for the current user, so no administrator rights are needed.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Ahral
  artifactName: Ahral-Setup-${version}.${ext}
  # Your documents, exams and attempts survive an uninstall or upgrade.
  deleteAppDataOnUninstall: false
