name: Release

# Publishing a version:
#   1. Set "version" in package.json (e.g. 0.2.0) and commit it.
#   2. git tag v0.2.0 && git push origin v0.2.0
# This builds and tests the installer, then attaches it to a GitHub release for that tag.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Check the tag matches package.json
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - run: npm ci
      - run: npx biome ci .
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run test:packaged
      - run: npm run installer
      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/Ahral-Setup-*.exe --title "Ahral $GITHUB_REF_NAME" --generate-notes
