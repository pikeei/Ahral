name: Website

# Builds the website, runs its end-to-end tests in a real browser (desktop and phone size),
# and on main publishes it to GitHub Pages. Needs Pages turned on once in the repository:
# Settings -> Pages -> Build and deployment -> Source: GitHub Actions.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits rather than cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Builds dist-web/ and tests it in Google Chrome, which GitHub's Linux machines have.
      - run: npm run test:web
        env:
          PW_CHANNEL: chrome
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: website-test-reports
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
      - name: Upload the site for GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist-web

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
