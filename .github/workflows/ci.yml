name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Print versions so a lockfile mismatch between npm releases is easy to spot.
      - run: node --version && npm --version
      - run: npm ci
      - name: Lint and format check
        run: npx biome ci .
      - run: npm run typecheck
      # Unit + integration tests, including the golden-file pipeline test; fails below coverage thresholds.
      - run: npm run test:coverage
      - run: npm run test:e2e
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            playwright-report/
            test-results/
            coverage/
          if-no-files-found: ignore
